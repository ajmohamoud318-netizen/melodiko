<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- Single eighth note -->
    <g id="note1">
      <ellipse cx="0" cy="0" rx="7" ry="5" transform="rotate(-25)" fill="none"/>
      <line x1="6.2" y1="-1.5" x2="6.2" y2="-24" stroke-linecap="round"/>
      <path d="M6.2,-24 C16,-20 16,-10 6.2,-7" fill="none" stroke-linecap="round"/>
    </g>
    <!-- Double beamed notes -->
    <g id="note2">
      <ellipse cx="-13" cy="2" rx="7" ry="5" transform="rotate(-25,-13,2)" fill="none"/>
      <line x1="-7" y1="0" x2="-7" y2="-20" stroke-linecap="round"/>
      <ellipse cx="8" cy="0" rx="7" ry="5" transform="rotate(-25,8,0)" fill="none"/>
      <line x1="14" y1="-2" x2="14" y2="-22" stroke-linecap="round"/>
      <rect x="-7" y="-23" width="21" height="4" rx="2" fill="currentColor"/>
    </g>
    <!-- Treble clef (simplified) -->
    <g id="clef">
      <path d="M0,20 C-14,20 -14,-2 0,-2 C14,-2 14,10 0,10 C-8,10 -8,0 0,0 C8,0 12,-10 6,-18 C3,-22 -2,-22 -2,-14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="-2" cy="25" r="3" fill="none"/>
    </g>
    <!-- 5-pointed star -->
    <g id="star">
      <path d="M0,-13 L3.1,-4.3 L12.3,-4 L5.1,1.6 L7.6,10.5 L0,6 L-7.6,10.5 L-5.1,1.6 L-12.3,-4 L-3.1,-4.3 Z" fill="none" stroke-linejoin="round"/>
    </g>
    <!-- Small star -->
    <g id="starSm">
      <path d="M0,-8 L1.9,-2.6 L7.6,-2.5 L3.1,1 L4.7,6.4 L0,3.7 L-4.7,6.4 L-3.1,1 L-7.6,-2.5 L-1.9,-2.6 Z" fill="none" stroke-linejoin="round"/>
    </g>
    <!-- Heart -->
    <g id="heart">
      <path d="M0,9 C-0.5,7.5 -11,-1 -11,-6 C-11,-11 -7.5,-14 -4,-12 C-2,-11 0,-9 0,-9 C0,-9 2,-11 4,-12 C7.5,-14 11,-11 11,-6 C11,-1 0.5,7.5 0,9 Z" fill="none"/>
    </g>
    <!-- Cloud -->
    <g id="cloud">
      <path d="M-15,5 A7,7 0 0,1 -12,-4 A10,10 0 0,1 3,-11 A8,8 0 0,1 16,-4 A7,7 0 0,1 17,5 Z" fill="none" stroke-linejoin="round"/>
    </g>
    <!-- Maraca -->
    <g id="maraca">
      <circle cx="0" cy="-14" r="9" fill="none"/>
      <line x1="0" y1="-5" x2="0" y2="14" stroke-linecap="round"/>
      <line x1="-4" y1="14" x2="4" y2="14" stroke-linecap="round"/>
    </g>
    <!-- Shooting star -->
    <g id="shoot">
      <path d="M0,-8 L1.4,-2 L5.6,-1.9 L2.3,0.8 L3.5,4.9 L0,2.8 L-3.5,4.9 L-2.3,0.8 L-5.6,-1.9 L-1.4,-2 Z" fill="none" stroke-linejoin="round"/>
      <line x1="-7" y1="6" x2="-16" y2="14" stroke-linecap="round"/>
      <line x1="-5" y1="8" x2="-13" y2="16" stroke-linecap="round"/>
      <line x1="-10" y1="5" x2="-19" y2="13" stroke-linecap="round"/>
    </g>
    <!-- Dot -->
    <circle id="dot" cx="0" cy="0" r="2.8"/>
  </defs>

  <!-- stroke style for all elements -->
  <g stroke="#c98a00" stroke-width="2.2" fill="none" stroke-linecap="round">

    <!-- row 1 -->
    <use href="#note1"  x="55"  y="65"  transform="translate(55,65) rotate(-15) scale(1.1)"/>
    <use href="#dot"    x="110" y="50"  transform="translate(110,50)" fill="#c98a00" stroke="none"/>
    <use href="#cloud"  x="155" y="55"  transform="translate(155,55) scale(1.0)"/>
    <use href="#starSm" x="230" y="35"  transform="translate(230,35) rotate(5)"/>
    <use href="#star"   x="295" y="50"  transform="translate(295,50) rotate(-8) scale(0.9)"/>
    <use href="#note2"  x="370" y="60"  transform="translate(370,60) rotate(10) scale(1.0)"/>
    <use href="#dot"    x="445" y="42"  transform="translate(445,42)" fill="#c98a00" stroke="none"/>
    <use href="#starSm" x="480" y="52"  transform="translate(480,52) rotate(-5) scale(1.1)"/>
    <use href="#maraca" x="535" y="55"  transform="translate(535,55) rotate(12) scale(1.0)"/>

    <!-- row 2 -->
    <use href="#heart"  x="30"  y="130" transform="translate(30,130) rotate(-10) scale(0.95)"/>
    <use href="#note1"  x="90"  y="155" transform="translate(90,155) rotate(8) scale(1.2)"/>
    <use href="#clef"   x="185" y="165" transform="translate(185,165) scale(0.7)"/>
    <use href="#dot"    x="255" y="120" transform="translate(255,120)" fill="#c98a00" stroke="none"/>
    <use href="#cloud"  x="340" y="130" transform="translate(340,130) rotate(-5) scale(0.85)"/>
    <use href="#note2"  x="430" y="150" transform="translate(430,150) rotate(-12) scale(0.9)"/>
    <use href="#heart"  x="510" y="125" transform="translate(510,125) rotate(15) scale(1.1)"/>
    <use href="#shoot"  x="565" y="145" transform="translate(565,145) rotate(-20) scale(1.1)"/>

    <!-- row 3 -->
    <use href="#star"   x="25"  y="230" transform="translate(25,230) rotate(12) scale(0.85)"/>
    <use href="#maraca" x="120" y="220" transform="translate(120,220) rotate(-8) scale(0.9)"/>
    <use href="#dot"    x="195" y="218" transform="translate(195,218)" fill="#c98a00" stroke="none"/>
    <use href="#note1"  x="255" y="240" transform="translate(255,240) rotate(5) scale(1.0)"/>
    <use href="#shoot"  x="330" y="215" transform="translate(330,215) rotate(10) scale(0.9)"/>
    <use href="#starSm" x="405" y="225" transform="translate(405,225) rotate(-15)"/>
    <use href="#cloud"  x="475" y="220" transform="translate(475,220) scale(0.9)"/>
    <use href="#dot"    x="560" y="230" transform="translate(560,230)" fill="#c98a00" stroke="none"/>

    <!-- row 4 -->
    <use href="#note2"  x="40"  y="320" transform="translate(40,320) rotate(-10) scale(1.1)"/>
    <use href="#heart"  x="140" y="305" transform="translate(140,305) rotate(8) scale(0.8)"/>
    <use href="#dot"    x="205" y="295" transform="translate(205,295)" fill="#c98a00" stroke="none"/>
    <use href="#star"   x="265" y="325" transform="translate(265,325) rotate(-6) scale(0.95)"/>
    <use href="#clef"   x="365" y="340" transform="translate(365,340) scale(0.65)"/>
    <use href="#note1"  x="430" y="315" transform="translate(430,315) rotate(12) scale(1.05)"/>
    <use href="#starSm" x="500" y="305" transform="translate(500,305) rotate(18)"/>
    <use href="#shoot"  x="555" y="320" transform="translate(555,320) rotate(-10) scale(1.05)"/>

    <!-- row 5 (bottom) -->
    <use href="#cloud"  x="70"  y="390" transform="translate(70,390) scale(0.8)"/>
    <use href="#note2"  x="185" y="385" transform="translate(185,385) rotate(6) scale(0.9)"/>
    <use href="#dot"    x="290" y="375" transform="translate(290,375)" fill="#c98a00" stroke="none"/>
    <use href="#heart"  x="360" y="388" transform="translate(360,388) rotate(-12) scale(0.9)"/>
    <use href="#maraca" x="445" y="382" transform="translate(445,382) rotate(5) scale(0.85)"/>
    <use href="#starSm" x="520" y="378" transform="translate(520,378) rotate(8)"/>
    <use href="#note1"  x="565" y="390" transform="translate(565,390) rotate(-8) scale(0.95)"/>
  </g>
</svg>
